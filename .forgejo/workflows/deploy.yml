on:
  push:
    branches:
      - develop
      - master

jobs:
  setup:
    runs-on: docker
    outputs:
      tag: ${{ steps.tag.outputs.name }}
    steps:
      - name: "Retrieve version"
        id: version
        uses: https://forgejo.van-de-weerd.net/parcifal/common/toml-attribute@master
        with:
          key: project.version

      - name: "Determine tag"
        id: tag
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.value }}"
          
          if [ "${{ github.ref_name }}" = "develop" ]; then
            TAG="$TAG-dev"
          fi
          
          echo "name=$TAG" >> "$GITHUB_STEP_OUTPUT"

